<head>

.pill{display:inline-block;background:#eef6ff;color:#155b95;border-radius:999px;padding:4px 8px;margin:3px 5px 0 0}.hidden{display:none}
.rolebox{background:#eff8ff;border:1px solid #cde3f8;padding:15px;border-radius:13px;margin-top:14px}

<body><div class="wrap">
<div class="hero">

</div>

</div>

</div>

<div id="survey" class="hidden">

  <b id="roleTitle"></b>

  <div class="progress"><div class="bar" id="bar" style="width:0"></div></div>
 </div>
 <div id="sections"></div>
 <div class="card"><h2>与你岗位相关的资料清单</h2><div id="materials"></div></div>
</div>
</div>

运营 / 出单 / 客服", "id": "F4", "text": "最容易出错或返工的字段、表单和流程是什么？", "roles": ["operations"]}, {"section": "F", "domain": "运营 / 出单 / 客服", "id": "F5", "text": "批改、加减人、续保、保全分别如何处理？月均处理量大约多少？", "roles": ["operations"]}, {"section": "F", "domain": "运营 / 出单 / 客服", "id": "F6", "text": "哪些工作如果自动化，会最明显地提高你的服务效率和准确率？", "roles": ["operations"]}, {"section": "G", "domain": "财务 / 佣金结算", "id": "G1", "text": "保费、佣金、发票、应收应付、付款审批目前分别在哪些系统或 Excel 中管理？", "roles": ["finance"]}, {"section": "G", "domain": "财务 / 佣金结算", "id": "G2", "text": "佣金如何计算、核对和结算？哪些环节仍依赖人工 Excel？", "roles": ["finance"]}, {"section": "G", "domain": "财务 / 佣金结算", "id": "G3", "text": "对账最常见的差异和返工原因是什么？", "roles": ["finance"]}, {"section": "G", "domain": "财务 / 佣金结算", "id": "G4", "text": "经纪人能否及时看到自己的应收佣金、已收佣金和结算状态？", "roles": ["finance"]}, {"section": "G", "domain": "财务 / 佣金结算", "id": "G5", "text": "哪些业务数据需要从泛微或其他系统二次录入财务？", "roles": ["finance"]}, {"section": "G", "domain": "财务 / 佣金结算", "id": "G6", "text": "你最希望系统自动生成哪些报表、核对结果或异常提醒？", "roles": ["finance"]}, {"section": "H", "domain": "合规 / 法务 / 内控", "id": "H1", "text": "目前哪些业务动作必须经过合规、法务或管理层审批？", "roles": ["compliance"]}, {"section": "H", "domain": "合规 / 法务 / 内控", "id": "H2", "text": "客户告知、产品推荐、授权、业务档案、佣金、投诉等关键证据目前如何留存？", "roles": ["compliance"]}, {"section": "H", "domain": "合规 / 法务 / 内控", "id": "H3", "text": "哪些岗位可以查看、导出、修改敏感客户资料？权限是否定期复核？", "roles": ["compliance"]}, {"section": "H", "domain": "合规 / 法务 / 内控", "id": "H4", "text": "管理员后台修改、数据导出、权限变更是否有审批和审计日志？", "roles": ["compliance"]}, {"section": "H", "domain": "合规 / 法务 / 内控", "id": "H5", "text": "当前最担心的三类合规风险是什么？", "roles": ["compliance"]}, {"section": "H", "domain": "合规 / 法务 / 内控", "id": "H6", "text": "哪些 AI 使用场景你认为必须设置人工审批或禁止自动执行？", "roles": ["compliance"]}, {"section": "I", "domain": "IT / 系统管理员", "id": "I1", "text": "当前主要系统有哪些？分别由谁管理、部署在哪里、年费和运维成本大约多少？", "roles": ["it"]}, {"section": "I", "domain": "IT / 系统管理员", "id": "I2", "text": "企微、泛微、财务及其他系统目前有哪些 API、数据库接口或导出能力？", "roles": ["it"]}, {"section": "I", "domain": "IT / 系 let schema=null,rid=localStorage.getItem("diag_v12_rid")||"",currentRole=localStorage.getItem("diag_v12_role")||"";
let LOCAL_PREVIEW = (location.protocol === "file:");
let mediaRecorder=null,chunks=[],currentQ=null;
const $=id=>document.getElementById(id);
function esc(s){return (s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
async function api(url,opt={}){
  if(LOCAL_PREVIEW) throw new Error("local-preview");
  const r=await fetch(url,opt);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function init(){
  try{
    schema = LOCAL_PREVIEW ? EMBEDDED_SCHEMA : await api("/api/schema");
  }catch(e){
    schema = EMBEDDED_SCHEMA;
    LOCAL_PREVIEW = true;
  }
  $("role").innerHTML = Object.entries(schema.roles)

  if(currentRole && schema.roles[currentRole]) $("role").value=currentRole;
  $("roleHint").innerHTML = LOCAL_PREVIEW
    ? "当前为<strong>本地预览模式</strong>：可以选择角色并完整浏览/填写问卷；答案只保存在本机浏览器，不会同步到后台。正式部署后会自动切换为服务器同步模式。"
    : "选择岗位后，只会显示与你相关的问题。";
}
function applicableQuestions(role){return schema.questions.filter(q=>q.roles.includes(role))}
function applicableMaterials(role){return schema.materials.filter(m=>m.roles.includes(role))}
function renderSurvey(role){
 currentRole=role; localStorage.setItem("diag_v12_role",role);
 const qs=applicableQuestions(role), mats=applicableMaterials(role);
 $("roleTitle").textContent=`当前身份：${schema.roles[role]}`;
 $("countText").textContent=`仅显示与你相关的 ${qs.length} 个问题。`;
 $("sections").innerHTML="";
 const grouped={}; for(const q of qs){if(!grouped[q.section])grouped[q.section]=[];grouped[q.section].push(q)}
 for(const [sec,items] of Object.entries(grouped)){
   const c=document.createElement("div");c.className="card";c.innerHTML=`<h2>${esc(items[0].domain)}</h2>`;
   for(const q of items){
     const d=document.createElement("div");d.className="q";
     d.innerHTML=`<div class="qid">${q.id}</div><div class="qtext">${esc(q.text)}</div>
       <textarea id="t_${q.id}" placeholder="可以文字回答；也可以录音回答"></textarea>
       <div class="actions">
        <button class="primary" onclick="saveAnswer('${q.id}')">保存文字</button>
        <button class="secondary" id="rec_${q.id}" onclick="toggleRecord('${q.id}')">🎙 开始录音</button>
        <label class="secondary btn">上传附件/录音<input type="file" multiple style="display:none" onchange="uploadFiles('${q.id}',this.files)"></label>
        <span class="status" id="st_${q.id}"></span>
       </div><div id="files_${q.id}"></div>`;
     c.appendChild(d);
   } $("sections").appendChild(c);
 }
 $("materials").innerHTML=mats.map(m=>`<div class="material"><input type="checkbox" id="m_${m.id}" onchange="saveMaterial('${m.id}',this.checked)"><div><b>${m.id}</b> ${esc(m.text)}</div></div>`).join("") || '<div class="small">当前岗位暂无必须准备的资料。</div>';
 $("survey").classList.remove("hidden");
 restoreLocal(qs,mats); updateProgress();
}
async function start(){
 const role=$("role").value; renderSurvey(role);
 if(!rid){
   const r=await api("/api/respondents",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("name").value,role:schema.roles[role],company:$("company").value})});
   rid=r.respondent_id;localStorage.setItem("diag_v12_rid",rid);
 }
 $("ridText").textContent="填写编号："+rid;
}
async function saveAnswer(qid){
 if(!rid) await start();
 const text=$("t_"+qid).value;
 if(!LOCAL_PREVIEW){
   await api("/api/answers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({respondent_id:rid,question_id:qid,text})});
 }
 localStorage.setItem("v12_ans_"+qid,text);
 $("st_"+qid).textContent=LOCAL_PREVIEW ? "已保存在本机浏览器" : "已保存到服务器";
 updateProgress();
}
async function saveMaterial(mid,checked){
 if(!rid) await start();
 if(!LOCAL_PREVIEW){
   await api("/api/materials",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({respondent_id:rid,material_id:mid,checked})});
 }
 localStorage.setItem("v12_mat_"+mid,checked?"1":"0");
}
async function uploadBlob(qid,blob,name,kind){
 if(!rid) await start();
 if(LOCAL_PREVIEW){
   $("files_"+qid).innerHTML+=`<span class="pill">${kind==="audio"?"🎙":"📎"} ${esc(name)}（本地预览，不上传）</span>`;
   return;
 }
 const fd=new FormData();fd.append("respondent_id",rid);fd.append("question_id",qid);fd.append("kind",kind);fd.append("file",blob,name);
 const r=await fetch("/api/upload",{method:"POST",body:fd});if(!r.ok)throw new Error(await r.text());const x=await r.json();
 $("files_"+qid).innerHTML+=`<span class="pill">${kind==="audio"?"🎙":"📎"} ${esc(name)}</span>`;
}
async function uploadFiles(qid,files){for(const f of files)await uploadBlob(qid,f,f.name,f.type.startsWith("audio/")?"audio":"attachment");$("st_"+qid).textContent="文件已上传"}
async function toggleRecord(qid){
 if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();return}
 if(!navigator.mediaDevices?.getUserMedia){alert("当前环境无法直接录音，请上传已有录音。正式部署建议使用 HTTPS。");return}
 try{
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];currentQ=qid;mediaRecorder=new MediaRecorder(stream);
 mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:mediaRecorder.mimeType||"audio/webm"});await uploadBlob(currentQ,b,`answer_${currentQ}_${Date.now()}.webm`,"audio");$("rec_"+currentQ).textContent="🎙 开始录音";$("st_"+currentQ).textContent="录音已上传"};
 mediaRecorder.start();$("rec_"+qid).textContent="⏹ 停止并上传";
 }catch(e){alert("无法启用麦克风："+e.message)}
}
function restoreLocal(qs,mats){for(const q of qs){const v=localStorage.getItem("v12_ans_"+q.id);if(v!==null)$("t_"+q.id).value=v}for(const m of mats){$("m_"+m.id).checked=localStorage.getItem("v12_mat_"+m.id)==="1"}}
function updateProgress(){const qs=applicableQuestions(currentRole);let n=0;for(const q of qs){if(($("t_"+q.id)?.value||"").trim())n++}const p=qs.length?Math.round(n/qs.length*100):0;$("bar").style.width=p+"%";$("countText").textContent=`与你相关的问题 ${qs.length} 个；文字已完成 ${n} 个（录音回答不计入该比例）。`}
document.addEventListener("input",e=>{if(e.target.tagName==="TEXTAREA"){localStorage.setItem("v12_ans_"+e.target.id.replace("t_",""),e.target.value);updateProgress()}});
$("startBtn").onclick=start;
init().then(()=>{if(currentRole){$("role").value=currentRole;renderSurvey(currentRole);if(rid)$("ridText").textContent="填写编号："+rid}});
</script></body></html>

services:
  - type: web
    name: insurance-diagnosis-pilot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DIAG_ADMIN_TOKEN
        generateValue: true
      - key: DIAG_MAX_UPLOAD_MB
        value: "12"
      - key: DIAG_TRANSCRIBE_PROVIDER
        value: none
